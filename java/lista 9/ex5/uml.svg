              <div style="display: inline-block; font-size: 12px; font-family: Helvetica; color: #000000; line-height: 1.2; pointer-events: all; white-space: nowrap; font-weight: bold;">B</div>
            </div>
          </div>
        </foreignObject>
        <text x="120" y="179" fill="#000000" font-family="Helvetica" font-size="12px" text-anchor="middle" font-weight="bold">B</text>
